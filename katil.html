<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bize Katıl — SBK</title>
<meta name="description" content="Cerrahpaşa'da sağlıklı beslenen insanların kulübü. Bu kulüp sensin.">
<meta name="theme-color" content="#000000">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="katil">
<main>
<section class="px-5 md:px-10 pt-36 pb-24 md:pb-44">
  <h1 class="display text-[13vw] md:text-[8vw] uppercase max-w-5xl">Tek bir adım at.</h1>
  <form id="join" class="mt-16 max-w-3xl" novalidate>
    <label for="email" class="block text-sm text-zinc-400 mb-3">E-posta adresin</label>
    <div class="flex flex-col md:flex-row border bd focus-within:border-white transition-colors">
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="ad@posta.com" class="flex-1 bg-black px-5 py-5 text-lg md:text-xl placeholder-zinc-700 outline-none min-w-0">
      <button type="submit" class="btn btn-red px-8 py-5 text-base font-black uppercase">Sistemden Çık</button>
    </div>
    <label class="mt-4 flex gap-3 items-start text-sm text-zinc-400 cursor-pointer"><input type="checkbox" name="sms" class="mt-1 accent-[#e11d2e]"> Haftalık SMS mesajlarını almak istiyorum.</label>
    <p id="msg" class="mt-4 text-sm min-h-[1.25rem] text-zinc-400" role="status" aria-live="polite"></p>
  </form>
  <p class="mt-16 text-zinc-500 max-w-xl leading-relaxed">Bazen kaçamak yapma fikrine girersen, bu kulübü hatırla.</p>
</section>
</main>
<script src="main.js"></script>
</body>
</html>
